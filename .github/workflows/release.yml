name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build
        shell: cmd
        run: build.bat

      # Only builds the installer. The release itself is published by the owner with gh, so it is authored by
      # the owner and not by github-actions[bot]:
      #   gh run download <run id> -n installer -D out
      #   gh release create vX.Y.Z out/PUBG_Inviter_Setup_X.Y.Z.exe --title "PUBG Clan Inviter X.Y.Z" --notes-file notes.md --verify-tag
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/PUBG_Inviter_Setup_*.exe
          if-no-files-found: error
